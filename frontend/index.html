<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Charts</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Charts <a class="nav" href="/screener" style="color:var(--text-dim);text-decoration:none;margin-left:14px;font-size:14px;font-weight:400">Screener</a></div>
  <div class="controls">
    <label class="count-label" for="chart-count">Number of charts</label>
    <select id="chart-count">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="4">4</option>
      <option value="6">6</option>
      <option value="8">8</option>
    </select>
    <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
    <div class="menu-wrap">
      <button type="button" id="theme-btn" class="menu-btn" title="Colours">Theme ▾</button>
      <div id="theme-menu" class="menu menu-list hidden"></div>
    </div>
    <div class="menu-wrap">
      <button type="button" id="layouts-btn" class="menu-btn" title="Saved layouts">Layouts ▾</button>
      <div id="layouts-menu" class="menu menu-list hidden"></div>
    </div>
    <button type="button" id="side-toggle" class="menu-btn" title="Watchlist &amp; alerts">☰ Watchlist</button>
  </div>
</header>

<div class="workspace">
<main id="charts-grid" class="charts-grid" data-count="4"></main>
<aside id="sidebar" class="sidebar">
  <section class="side-section">
    <h5>Watchlist <span id="wl-count" class="dim"></span></h5>
    <div class="side-add"><input type="text" id="wl-add" placeholder="Add symbol (e.g. VOLV-B.ST)"><button type="button" id="wl-add-btn">+</button></div>
    <table class="wl" id="wl"><tbody></tbody></table>
    <div class="dim tiny">Click a row to load it in the first chart. Prices delayed ~15 min.</div>
  </section>
  <section class="side-section">
    <h5>Price alerts</h5>
    <div class="side-add alert-form">
      <input type="text" id="al-sym" placeholder="Symbol" size="9">
      <select id="al-cond"><option value="above">rises above</option><option value="below">falls below</option></select>
      <input type="number" id="al-price" placeholder="Price" step="any" size="7">
      <button type="button" id="al-add-btn">Set</button>
    </div>
    <div id="al-list" class="al-list"></div>
    <div class="dim tiny">Checked on the server every minute — fires even when this page is closed. <a href="#" id="al-notify">Enable desktop notifications</a></div>
  </section>
</aside>
</div>
<div id="toasts" class="toasts"></div>

<template id="pane-template">
  <section class="pane" data-pane-id="">
    <div class="pane-header">
      <select class="pane-source">
        <option value="yfinance">Stocks (Yahoo, ~15 min delay)</option>
        <option value="hyperliquid">Crypto (Hyperliquid, live)</option>
      </select>
      <div class="pane-symbol-wrap">
        <input class="pane-symbol" type="text" spellcheck="false" autocomplete="off" placeholder="Company name or symbol">
        <div class="pane-symbol-results hidden"></div>
      </div>
      <select class="pane-interval">
        <option value="1m">1m</option>
        <option value="5m">5m</option>
        <option value="15m">15m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
        <option value="1D">1D</option>
        <option value="1W">1W</option>
        <option value="1M">1M</option>
      </select>
      <select class="pane-chart-type" title="Chart type">
        <option value="candle_solid">Candles</option>
        <option value="candle_stroke">Hollow candles</option>
        <option value="ohlc">Bars (OHLC)</option>
        <option value="area">Area</option>
      </select>
      <div class="menu-wrap">
        <button type="button" class="menu-btn pane-ind-btn" title="Indicators">Indicators ▾</button>
        <div class="menu pane-ind-menu hidden"></div>
      </div>
      <select class="pane-draw-tool" title="Draw">
        <option value="">Draw…</option>
        <optgroup label="Lines">
          <option value="segment">Trend line</option>
          <option value="rayLine">Ray</option>
          <option value="straightLine">Extended line</option>
          <option value="horizontalStraightLine">Horizontal line</option>
          <option value="horizontalRayLine">Horizontal ray</option>
          <option value="horizontalSegment">Horizontal segment</option>
          <option value="verticalStraightLine">Vertical line</option>
          <option value="priceLine">Price line (label)</option>
        </optgroup>
        <optgroup label="Channels &amp; Fib">
          <option value="parallelStraightLine">Parallel channel</option>
          <option value="priceChannelLine">Price channel</option>
          <option value="fibonacciLine">Fib retracement</option>
        </optgroup>
        <optgroup label="Shapes &amp; notes">
          <option value="rect">Rectangle</option>
          <option value="circle">Circle</option>
          <option value="polygon">Polygon</option>
          <option value="arc">Arc</option>
          <option value="text">Text</option>
          <option value="simpleAnnotation">Annotation (arrow + text)</option>
          <option value="simpleTag">Price tag</option>
        </optgroup>
      </select>
      <button type="button" class="pane-draw-clear" title="Clear drawings">Clear</button>
      <button type="button" class="pane-scale" title="Price scale: linear / log / percent">Lin</button>
      <button type="button" class="pane-snap" title="Save chart as PNG">PNG</button>
      <button type="button" class="pane-max" title="Maximize / restore (Esc)">Max</button>
      <button type="button" class="pane-cmp" title="Compare with another symbol (rebased line)">Compare</button>
      <button type="button" class="pane-replay" title="Bar replay: step through history">Replay</button>
      <button type="button" class="pane-analyse" title="Graham / Buffett / Munger reading of this stock">Analyse</button>
      <button type="button" class="pane-ta" title="Auto-draw trendlines, support/resistance, gaps (Verified-Investing style) and read the setup">Auto lines</button>
    </div>
    <div class="pane-replay-bar hidden">
      <button type="button" class="rp-start" title="Jump to start">⏮</button>
      <button type="button" class="rp-back" title="One bar back">◀</button>
      <button type="button" class="rp-play" title="Play / pause">▶</button>
      <button type="button" class="rp-fwd" title="One bar forward">▶|</button>
      <input type="range" class="rp-pos" min="10" max="100" value="50">
      <select class="rp-speed"><option value="1000">1×</option><option value="400" selected>2.5×</option><option value="150">7×</option><option value="50">20×</option></select>
      <span class="rp-info dim"></span>
      <button type="button" class="rp-exit" title="Leave replay">Exit</button>
    </div>
    <div class="pane-ticker">
      <span class="ticker-symbol"></span>
      <span class="ticker-price">--</span>
      <span class="quality-badge"></span>
      <span class="conn-badge"></span>
      <span class="ticker-info"></span>
    </div>
    <div class="pane-ta-read hidden"></div>
    <div class="pane-ranges">
      <button data-range="1M">1M</button><button data-range="3M">3M</button><button data-range="6M">6M</button>
      <button data-range="YTD">YTD</button><button data-range="1Y">1Y</button><button data-range="2Y">2Y</button>
      <button data-range="5Y">5Y</button><button data-range="10Y">10Y</button><button data-range="20Y">20Y</button>
      <button data-range="30Y">30Y</button><button data-range="ALL">All</button>
      <span class="pane-range-info dim"></span>
    </div>
    <div class="pane-body">
      <div class="pane-chart"></div>
      <div class="pane-rsi-chart hidden"></div>
      <div class="pane-error hidden"></div>
    </div>
  </section>
</template>

<script src="/static/js/theme.js?v=2"></script>
<script src="/static/vendor/klinecharts.min.js"></script>
<script src="/static/js/overlays.js"></script>
<script src="/static/js/technicals.js?v=2"></script>
<script src="/static/js/app.js?v=20"></script>
<script src="/static/js/sidebar.js?v=2"></script>
<script src="/static/js/analysis.js?v=2"></script>
</body>
</html>
